function recommends(){
 const c=context(), jobs=D.jobs, chosen=[],ids=new Set(),tracks=new Map();
 // Interest matches dominate. Diversification is a tiebreaker within matches,
 // never a reason to replace a relevant job with an unrelated one.
 let keys=c.primary?[c.primary,...c.runner]:c.lead.length>1?c.lead.slice():c.rank.slice(0,3);
 keys=[...new Set(keys)];
 if(state.focus)keys=[state.focus,...keys.filter(k=>k!==state.focus)];
 if(keys.length===0)keys=TYPEORDER.slice();
 const measured=c.primary?[c.primary,...c.runner]:c.lead.length>1?c.lead.slice():c.rank.slice(0,3);
 const focus=state.focus;
 let hash=2166136261;
 for(let i=0;i<state.answers.length;i++){hash=Math.imul((hash^(state.answers[i]||0)+i*7),16777619)>>>0}
 const rankHash=j=>{let h=hash;for(let i=0;i<j.id.length;i++)h=Math.imul(h^j.id.charCodeAt(i),16777619)>>>0;return h/4294967296};
 const relevance=j=>{
  let score=0;
  if(focus&&j.types.includes(focus))score+=6;
  if(c.primary&&j.types.includes(c.primary))score+=6;
  for(const k of measured){if(j.types.includes(k))score+=2}
  if(keys.length>1&&j.types.includes(keys[0])&&j.types.includes(keys[1]))score+=3;
  return score;
 };
 function offer(pool){
  const candidates=pool.filter(j=>!ids.has(j.id));
  if(!candidates.length)return false;
  candidates.sort((a,b)=>{
   const da=relevance(a)-Math.min(2,tracks.get(a.track)||0)*0.75;
   const db=relevance(b)-Math.min(2,tracks.get(b.track)||0)*0.75;
   return db-da||rankHash(a)-rankHash(b)||a.id.localeCompare(b.id);
  });
  const j=candidates[0];chosen.push(j);ids.add(j.id);tracks.set(j.track,(tracks.get(j.track)||0)+1);return true;
 }
 // Guarantee the student's manually selected exploration area participates.
 if(focus)for(let n=0;n<2;n++)offer(jobs.filter(j=>j.types.includes(focus)));
 // Equal runners are all represented when enough cards exist.
 const priority=[...new Set(measured.filter(k=>k!==focus))];
 for(const k of priority){if(chosen.length<7)offer(jobs.filter(j=>j.types.includes(k)))}
 // The remainder stays connected to one or more highlighted interests.
 const related=jobs.filter(j=>keys.some(k=>j.types.includes(k)));
 while(chosen.length<7&&offer(related)){}
 // Exactly one out-of-profile discovery card (when possible).
 const distant=jobs.filter(j=>!keys.some(k=>j.types.includes(k)));
 if(chosen.length<8)offer(distant);
 while(chosen.length<8&&offer(related)){}
 while(chosen.length<8&&offer(jobs)){}
 return chosen.slice(0,8);
}
function allFiltered(){const q=state.search.trim().toLowerCase();let jobs;if(state.filter==='추천'){jobs=(q||state.topic)?D.jobs:recommends()}else if(state.filter==='전체'){jobs=D.jobs}else if(state.filter==='즐겨찾기'){jobs=D.jobs.filter(j=>state.favorites.includes(j.id))}else{jobs=D.jobs.filter(j=>state.filter.length===1?j.types.includes(state.filter):j.track===state.filter)}if(state.topic)jobs=jobs.filter(j=>(j.topics||[]).includes(state.topic));if(q)jobs=jobs.filter(j=>[j.name,j.desc,j.field,j.track,...(j.aliases||[])].join(' ').toLowerCase().includes(q));return jobs.slice().sort((a,b)=>{if(!q)return 0;const score=j=>{const n=j.name.toLowerCase();if(n===q)return 100;if(n.startsWith(q))return 80;if(j.aliases?.some(x=>x.toLowerCase()===q))return 75;if(n.includes(q))return 60;if(j.aliases?.some(x=>x.toLowerCase().includes(q)))return 50;return 0};return score(b)-score(a)})}

function svgText(s){return esc(s)}
function svgWrap(text,limit=28){
 const lines=[];let line='',length=0;
 for(const ch of String(text??'')){
  const weight=/[\x00-\x7f]/.test(ch)?0.55:1;
  if(length+weight>limit&&line){lines.push(line);line='';length=0}
  line+=ch;length+=weight;
 }
 if(line)lines.push(line);return lines.length?lines:['-'];
}
function download(){
 try{
  const r=resultSummary(),js=state.pass.map(id=>D.jobs.find(x=>x.id===id)?.name).filter(Boolean);
  const sub=D.subjects.find(x=>x.id===state.chosenSubject);
  const sections=[
   ['검사에서 나타난 관심',r.shown],
   ['먼저 탐색할 관심',state.focus?state.focus+' '+D.types[state.focus].name:'아직 선택하지 않음'],
   ['관심 직업',js.length?js.join(' / '):'아직 탐색 중'],
   ['오늘 알아볼 과목',sub?.name||'아직 탐색 중'],
   ['체험 후 알게 된 점',state.reflection||'이 과목에서는 어떤 활동을 하나요?']
  ];
  let y=305,content='';
  for(const [label,value] of sections){
   content+=`<text x="80" y="${y}" font-size="23" fill="#77ddeb" font-family="sans-serif">${svgText(label)}</text>`;y+=42;
   for(const line of svgWrap(value,27)){
    content+=`<text x="80" y="${y}" font-size="27" font-weight="bold" fill="#ffffff" font-family="sans-serif">${svgText(line)}</text>`;
    y+=39;
   }
   y+=30;content+=`<line x1="80" x2="720" y1="${y-12}" y2="${y-12}" stroke="#425d7a"/>`;y+=20;
  }
  const height=Math.max(1120,y+95);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="${height}" viewBox="0 0 800 ${height}"><rect width="800" height="${height}" fill="#0d1835"/><rect x="35" y="35" width="730" height="${height-70}" rx="34" fill="#172849" stroke="#80e1eb" stroke-width="3"/><text x="80" y="108" font-size="24" font-family="sans-serif" fill="#97d8ef">CHANGWON GYEONGIL HIGH SCHOOL</text><text x="80" y="180" font-size="48" font-weight="bold" font-family="sans-serif" fill="white">나의 진로탐험 패스</text><text x="80" y="240" font-size="22" font-family="sans-serif" fill="#c6d7f2">지금의 관심에서 시작하는 진로·과목 탐험</text>${content}<text x="80" y="${height-63}" font-size="18" font-family="sans-serif" fill="#a8b8d2">RIASEC 간편 흥미탐색 · 진로 적합도 판정이 아닙니다 · v2.9</text></svg>`;
  const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='창원경일고_나의진로탐험패스_v2_8.svg';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),6000);
  note('저장을 요청했어요. 저장되지 않으면 화면을 캡처해 주세요.');
 }catch(err){console.error('결과 카드 저장 오류',err);note('결과 카드를 저장하지 못했어요. 화면 캡처나 텍스트 복사를 이용해 주세요.')}
}
function togglePass(id){const was=state.pass.includes(id);if(!was&&state.pass.length>=3){note('탐험 패스는 최대 3개예요. 먼저 하나를 빼 주세요.');return false}state.pass=was?state.pass.filter(x=>x!==id):[...state.pass,id];save();render();note(was?'패스에서 제외했어요.':'탐험 패스에 담았어요!');return true}
app.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-answer],[data-focus],[data-filter],[data-tab],[data-fav],[data-job],[data-pass],[data-subject],[data-track],[data-topic],[data-submode]');if(!el)return;let a=el.dataset.action;if(el.dataset.answer){state.answers[state.qIndex]=Number(el.dataset.answer);save();if(state.qIndex>=23){resultStart()}else{state.qIndex+=1;save();render()}window.scrollTo(0,0);return}if(el.dataset.focus){set({focus:el.dataset.focus});return}if(el.dataset.filter){set({filter:el.dataset.filter,search:el.dataset.filter==='추천'?'':state.search,topic:el.dataset.filter==='추천'?'':state.topic,sortAZ:false});return}if(el.dataset.tab){set({tab:el.dataset.tab,detail:null});window.scrollTo(0,0);return}if(el.dataset.topic){set({tab:'jobs',filter:'전체',topic:state.topic===el.dataset.topic?'':el.dataset.topic});return}if(el.dataset.submode){set({subjectMode:el.dataset.submode});return}if(el.dataset.track){set({tab:'jobs',filter:el.dataset.track,search:'',topic:''});window.scrollTo(0,0);return}if(el.dataset.job){set({detail:el.dataset.job});return}if(el.dataset.fav){let id=el.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();return}if(el.dataset.pass){togglePass(el.dataset.pass);return}if(el.dataset.subject){set({chosenSubject:el.dataset.subject});return}if(a==='start'){let i=state.answers.findIndex(x=>x===null);set({page:i<0?'result':'quiz',qIndex:i<0?0:i});return}if(a==='next'){if(state.answers[state.qIndex]===null)return;if(state.qIndex>=23){resultStart()}else set({qIndex:state.qIndex+1});return}if(a==='prev'){set({qIndex:Math.max(0,state.qIndex-1)});return}if(a==='jobs'){set({page:'result',tab:'jobs',filter:'전체',search:'',topic:''});window.scrollTo(0,0);return}if(a==='reset'||a==='restart'){if(confirm('저장된 검사 결과와 즐겨찾기를 모두 지우고 새로 시작할까요?')){newQuiz()}return}if(a==='home'){set({page:'home'});return}if(a==='results'){resultStart();return}if(a==='toggle-sort'){set({sortAZ:!state.sortAZ});return}if(a==='clear-search'){set({search:'',topic:'',filter:'전체'});return}if(a==='download'){download();return}if(a==='print'){window.print();return}if(a==='copy'){navigator.clipboard?.writeText(clipboard()).then(()=>note('탐험 내용을 복사했어요.')).catch(()=>note('복사가 지원되지 않아요.'));return}});
app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){let pos=e.target.selectionStart;state.search=e.target.value;save();const items=allFiltered();let box=document.getElementById('jobgrid');if(box)box.innerHTML=(state.sortAZ?[...items].sort((a,b)=>a.name.localeCompare(b.name,'ko')):items).map(jobCard).join('');const label=document.getElementById('job-count');if(label)label.textContent=`${items.length}개 직업 표시`;const empty=document.getElementById('job-empty');if(empty)empty.style.display=items.length?'none':'block';e.target.focus();try{e.target.setSelectionRange(pos,pos)}catch(err){}}if(e.target.id==='reflection'){state.reflection=e.target.value;save()}});
overlay.addEventListener('click',e=>{if(e.target.dataset.close){set({detail:null});return}let el=e.target.closest('[data-fav],[data-pass]');if(!el)return;let id=el.dataset.fav||el.dataset.pass;if(el.dataset.fav){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id]}else{togglePass(id);return}save();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail)set({detail:null})});try{render()}catch(err){console.error(err);app.innerHTML=`<section class="panel" style="margin-top:40px"><h2>시작 화면을 표시할 수 없어요</h2><p>페이지를 새로고침하거나 다른 브라우저를 이용해 주세요.</p><p class="tiny">관리자 확인: ${esc(err.message)}</p></section>`}

} catch(err) {fatal(err);console.error(err);}
})();
</script></body></html>
