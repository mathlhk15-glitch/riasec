'use strict';const D=JSON.parse(document.getElementById('app-data').textContent),app=document.getElementById('app'),overlay=document.getElementById('overlay');const KEY='gyeongil-career-v1';let state={page:'home',answers:Array(24).fill(null),focus:null,filter:'추천',search:'',favorites:[],pass:[],chosenSubject:null,reflection:'',detail:null,expand:false,tab:'profile',revealSeen:false};try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.answers?.length===24)state={...state,...saved,page:'home',detail:null}}catch(e){};const TYPEORDER=['R','I','A','S','E','C'];let toastTimer=null;function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function save(){try{const {detail,...s}=state;localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function set(p){Object.assign(state,p);save();render()}function note(m){let x=document.getElementById('toast');if(x)x.remove();x=document.createElement('div');x.id='toast';x.className='toast';x.textContent=m;document.body.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),2400)}function typePill(k){let t=D.types[k];return `<span class="pill" style="border-color:${t.tone}66">${t.icon} ${k} ${t.name}</span>`}function top(){return `<header class="top"><div class="brand">CHANGWON GYEONGIL HIGH SCHOOL<strong>나의 진로 DNA 찾기</strong></div><div class="top-actions">${state.page!=='home'?'<button class="circle" data-action="home">⌂ 홈</button>':''}<button class="circle" data-action="reset">↺ 초기화</button></div></header>`}function foot(){return `<div class="footer">창원경일고 고교학점제 체험 · RIASEC 기반 간편 흥미탐색<br>표준화된 심리검사가 아니며 지금의 관심은 앞으로 달라질 수 있습니다.<br>직업·과목 정보는 탐색 예시입니다. 학교 개설 여부는 별도 확인이 필요합니다.</div>`}function home(){let has=state.answers.some(v=>v!==null);return `${top()}<main><div class="hero"><div class="eyebrow">DISCOVER YOUR INTEREST</div><h1>나의 관심에서<br><span class="gradient">미래를 발견하다.</span></h1><p class="muted">24개의 짧은 질문으로 관심 활동을 알아보고,<br>12 function quiz(){let idx=state.answers.findIndex(v=>v===null);if(state.qIndex!=null)idx=state.qIndex;if(idx<0)idx=23;let q=D.questions[idx],val=state.answers[idx];return `${top()}<main><div class="row"><span class="mini">INTEREST CHECK</span><strong>${idx+1} <span class="muted">/ 24</span></strong></div><div class="progress section"><i style="width:${(idx+1)/24*100}%"></i></div><section class="panel qcard"><div class="tiny">이 활동을 얼마나 해보고 싶나요?</div><div class="question">${esc(q.text)}</div><div class="answers">${[[4,'😍','꼭 해보고 싶어!'],[3,'🙂','조금 해보고 싶어'],[2,'😐','별로 하고 싶지 않아'],[1,'🙅','전혀 하고 싶지 않아']].map(([n,em,t])=>`<button class="answer ${val===n?'sel':''}" data-answer="${n}"><span class="face">${em}</span><strong>${t}</strong><span style="margin-left:auto">${val===n?'✓':''}</span></button>`).join('')}</div><div class="nav"><button class="btn alt" data-action="prev" ${idx===0?'disabled':''}>← 이전</button><span class="tiny" style="align-self:center">선택하면 자동으로 넘어가요 ✓</span></div></section><div class="notice">💡 아직 해보지 않은 활동도 상상해서 답해 보세요. 점수는 직업 능력이나 성적을 뜻하지 않아요.</div></main>${foot()}`}
function scores(){let v=Object.fromEntries(TYPEORDER.map(k=>[k,0]));D.questions.forEach((q,i)=>v[q.type]+=(state.answers[i]||0));return v}function ranking(){let s=scores();return TYPEORDER.slice().sort((a,b)=>s[b]-s[a])}function context(){const s=scores(),rank=ranking(),max=s[rank[0]],min=Math.min(...Object.values(s)),lead=rank.filter(k=>s[k]===max),high=rank.filter(k=>s[k]>=max-1);let status;if(max<=8)status='이번에는 마음이 가는 활동을 찾는 중이에요. 직업보다는 관심 분야를 먼저 둘러보세요.';else if(min>=12)status='여러 활동에 관심이 높게 나타났어요. 마음 가는 분야부터 탐험해 보세요.';else if(high.length>=4)status='여러 유형의 점수가 비슷해요. 한 가지로 정하지 않고 폭넓게 살펴봐요.';else if(lead.length>1)status='가장 높은 점수가 같은 유형이 있어요. 어느 쪽이 더 궁금한지 직접 골라도 좋아요.';else status='이번 응답에서 눈에 띈 관심 활동이에요. 관심은 경험에 따라 달라질 수 있어요.';return {s,rank,lead,high,status,primary:state.focus&&high.includes(state.focus)?state.focus:rank[0],secondary:rank.find(k=>k!==(state.focus&&high.includes(state.focus)?state.focus:rank[0]))}}
function radar(s){let W=310,cx=155,cy=155,R=105;let xy=(k,r)=>{let i=TYPEORDER.indexOf(k),a=(-90+60*i)*Math.PI/180;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]},pts=TYPEORDER.map(k=>xy(k,R*(s[k]-4)/12).map(n=>n.toFixed(1)).join(',')).join(' ');return `<svg class="chart" viewBox="0 0 310 310" role="img" aria-label="6가지 흥미유형 점수 육각형 그래프">${[.25,.5,.75,1].map(v=>`<polygon points="${TYPEORDER.map(k=>xy(k,R*v).join(',')).join(' ')}" stroke="#ffffff29" fill="none"/>`).join('')}${TYPEORDER.map(k=>{let p=xy(k,R),t=xy(k,R+22);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#ffffff20"/><text x="${t[0]}" y="${t[1]+4}" font-size="13" text-anchor="middle" font-weight="bold" fill="${D.types[k].tone}">${k}</text>`}).join('')}<polygon points="${pts}" fill="#75daf455" stroke="#86e1f7" stroke-width="3"/>${TYPEORDER.map(k=>{let p=xy(k,R*(s[k]-4)/12);return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${D.types[k].tone}"/>`}).join('')}</svg>`}

>${['자연·공학','의약·보건','인문·사회','경영·경제','예술·미디어','생활·스포츠·환경'].map(x=>`<button class="chip" data-track="${x}">${x}</button>`).join('')}</div><button class="btn wide" data-action="jobs">직업 120개 탐험하기 →</button></section>`}
function recommends(){let c=context(),p=c.primary,s=c.secondary;let primary=D.jobs.filter(j=>j.types.includes(p)),secondary=D.jobs.filter(j=>j.types.includes(s)&&!j.types.includes(p)),mixed=D.jobs.filter(j=>j.types.includes(p)&&j.types.includes(s)),unrelated=D.jobs.filter(j=>!j.types.includes(p)&&!j.types.includes(s));let arr=[...mixed.slice(0,2),...primary.slice(0,3),...secondary.slice(0,2),...unrelated.slice(0,1)];return [...new Map(arr.map(j=>[j.id,j])).values()].slice(0,8)}function allFiltered(){let jobs=state.filter==='추천'?recommends():state.filter==='전체'?D.jobs:state.filter==='즐겨찾기'?D.jobs.filter(j=>state.favorites.includes(j.id)):D.jobs.filter(j=>state.filter.length===1?j.types.includes(state.filter):j.track===state.filter);let q=state.search.trim().toLowerCase();if(q)jobs=jobs.filter(j=>[j.name,j.desc,j.field,j.track,...j.aliases].join(' ').toLowerCase().includes(q));return jobs}

function subjectHtml(s,reason){return `<div class="subject"><div class="row"><strong>${esc(s.name)}</strong><span class="tiny">${esc(s.cat)} · ${esc(s.kind)}</span></div><div class="tiny">${esc(s.desc)}</div><div class="tiny">연결 이유: ${esc(reason||s.link)} · 학교 편성: <b>확인 중</b></div></div>`}
function detail(){let j=D.jobs.find(x=>x.id===state.detail);if(!j){overlay.innerHTML='';return}let subj=j.subjects.map(id=>D.subjects.find(s=>s.id===id)).filter(Boolean);let loved=state.favorites.includes(j.id),taken=state.pass.includes(j.id);overlay.innerHTML=`<div class="detail" data-close="1"><section class="detail-card" role="dialog" aria-modal="true" aria-label="${esc(j.name)} 직업 상세"><div class="row"><span class="kicker">JOB EXPLORER / ${esc(j.track)}</span><button class="circle" data-close="1">✕ 닫기</button></div><div style="font-size:48px;margin:11px 0">${D.types[j.types[0]].icon}</div><h2>${esc(j.name)}</h2><div class="pills">${j.types.map(typePill).join('')}</div><p>${esc(j.desc)}</p><div class="soft"><strong>🔎 이 직업을 보여주는 이유</strong><p class="tiny">${j.types.map(k=>D.types[k].verb).join(' · ')} 같은 활동과 연결되는 직업이에요. 원하는 분야라면 검사 점수와 관계없이 선택해도 좋아요.</p></div><h3 class="section">🔬 어떤 계열을 살펴볼까요?</h3><div class="pill">${esc(j.track)}</div><p class="tiny">이 직업과 관련된 분야를 알아보는 출발점입니다. 진학 계열을 확정하는 뜻은 아닙니다.</p><h3 class="section">📚 고등학교에서 알아볼 과목</h3>${subj.map(s=>subjectHtml(s,`${j.name}에서 다루는 ${s.cat} 분야의 기초와 활동을 탐색할 수 있어요`)).join('')}<div class="notice">학교의 실제 개설·운영 여부 및 과목 구분은 교육과정 편제표와 함께 반드시 확인하세요. 소개된 과목은 필수 이수과목이라는 뜻이 아닙니다.</div><h3 class="section">🌱 지금 해볼 활동</h3><p class="tiny">이 직업의 실제 일과 관련된 책이나 영상을 찾아보고, 관심 과목 부스에서 질문해 보세요.</p><div class="nav"><button class="btn alt" data-fav="${j.id}">${loved?'★ 즐겨찾기 해제':'☆ 즐겨찾기'}</button><button class="btn" data-pass="${j.id}">${taken?'✓ 패스에 담김':'＋ 탐험 패스 담기'}</button></div></section></div>`}
function mission(){let chosen=state.pass.map(id=>D.jobs.find(j=>j.id===id)).filter(Boolean);let chosenSubjects=[...new Set(chosen.flatMap(j=>j.subjects))].map(id=>D.subjects.find(s=>s.id===id)).filter(Boolean);return `<section class="section"><div class="eyebrow">MY EXPLORATION PASS</div><h2>나의 진로탐험 패스 🎟️</h2><p class="muted" style="font-size:14px">직업을 정하지 않아도 괜찮아요. 관심 과목 한 개를 찾았다면 오늘의 탐험은 성공!</p><div class="pass-card"><div class="mini">CHANGWON GYEONGIL · CAREER PASSPORT</div><h3 style="margin:13px 0">오늘의 관심 직업·분야</h3>${chosen.length?chosen.map(j=>`<div class="pill" style="margin:4px">${esc(j.name)} <button style="background:none;border:0;color:white" data-pass="${j.id}" aria-label="${esc(j.name)} 빼기">×</button></div>`).join(''):'<p class="tiny">아직 선택한 직업이 없어요. 직업 월드에서 직업을 담거나 과목부터 골라도 됩니다.</p>'}<div style="margin-top:16px"><strong>📘 오늘 더 알아볼 과목</strong><div style="margin-top:10px">${state.chosenSubject?`<span class="pill">${esc(D.subjects.find(s=>s.id===state.chosenSubject)?.name||'')}</span>`:'<span class="tiny">아래에서 과목을 골라주세요.</span>'}</div></div></div><section class="panel section"><h3>관심 있는 과목 골라보기</h3><p class="tiny">선택한 직업 관련 과목을 먼저 보여줘요. 직업을 고르지 않아도 모든 과목을 볼 수 있어요.</p>${(chosenSubjects.length?chosenSubjects:D.subjects).map(s=>`<button class="answer ${state.chosenSubject===s.id?'sel':''}" data-subject="${s.id}" style="margin:7px 0;min-height:45px"><span>📖</span><span><b>${esc(s.name)}</b><span class="tiny" style="display:block">${esc(s.desc)}</span></span>${state.chosenSubject===s.id?'<span style="margin-left:auto">✓</span>':''}</button>`).join('')}<h3 class="section">부스에서 물어볼 질문</h3><div class="soft">"이 과목에서는 어떤 재미있는 활동을 하나요?"</div><div class="soft" style="margin-top:7px">"어떤 직업이나 분야와 연결되나요?"</div><label for="reflection" style="display:block;margin:17px 0 8px;font-weight:700">체험하고 알게 된 점 (선택)</label><input class="search" id="reflection" maxlength="90" placeholder="짧게 한 줄 적어보세요" value="${esc(state.reflection)}"><p class="tiny">※ 실제 부스 위치·개설 여부는 행사 편제표 확인 후 추가할 예정입니다.</p></section><div class="stack section"><button class="btn wide" data-action="download">📥 결과 카드 이미지 저장 (SVG)</button><button class="btn alt wide" data-action="print">🖨 인쇄 또는 PDF로 저장</button><button class="btn ghost wide" data-action="copy">📋 나의 탐험 결과 텍스트 복사</button></div><p class="tiny">일부 휴대폰에서 저장이 어려우면 화면을 캡처해 주세요. 같은 브라우저에서는 검사 결과와 선택 내용을 이어볼 수 있어요.</p></section>`}
function results(){return `${top()}<nav class="tabbar" aria-label="결과 탭"><button class="${state.tab==='profile'?'active':''}" data-tab="profile">✦ 나의 결과</button><button class="${state.tab==='jobs'?'active':''}" data-tab="jobs">◈ 직업 120</button><button class="${state.tab==='pass'?'active':''}" data-tab="pass">▣ 진로 패스</button></nav>${state.tab==='profile'?profile():state.tab==='jobs'?jobs():mission()}${foot()}`}
function render(){app.innerHTML=state.page==='home'?home():state.page==='quiz'?quiz():results();detail();}
function celebrate(){try{if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<24;i++){let el=document.createElement('i');el.className='celebrate';el.style.left=(Math.random()*100)+'vw';el.style.background=['#6be9ef','#ffc856','#bc98ff','#ff8fc2'][i%4];el.style.setProperty('--drift',((Math.random()-.5)*110)+'px');el.style.animationDelay=(Math.random()*.35)+'s';document.body.append(el);setTimeout(()=>el.remove(),2800)}}catch(e){}}
function resultStart(){set({page:'result',tab:'profile',detail:null});if(!state.revealSeen){state.revealSeen=true;save();celebrate()}}
function newQuiz(){set({page:'quiz',answers:Array(24).fill(null),qIndex:0,focus:null,filter:'추천',search:'',favorites:[],pass:[],chosenSubject:null,reflection:'',tab:'profile',revealSeen:false})}
function clipboard(){let c=context(),j=state.pass.map(id=>D.jobs.find(x=>x.id===id)?.name).filter(Boolean),sub=D.subjects.find(x=>x.id===state.chosenSubject);return `창원경일고 나의 진로탐험 패스\n관심 유형: ${c.rank.slice(0,3).map(k=>k+' '+D.types[k].name).join(', ')}\n관심 직업: ${j.join(', ')||'아직 탐색 중'}\n알아볼 과목: ${sub?.name||'아직 탐색 중'}\n체험 후 알게 된 점: ${state.reflection||'-'}\n※ 간편 흥미탐색 결과이며 진로를 확정하지 않습니다.`}
function svgText(s){return esc(s)}
function download(){let c=context(),j=state.pass.map(id=>D.jobs.find(x=>x.id===id)?.name).filter(Boolean).slice(0,3),sub=D.subjects.find(x=>x.id===state.chosenSubject),clip=(x,n=28)=>x&&x.length>n?x.slice(0,n-1)+'…':x||'아직 탐색 중';let textlines=[['나의 관심 유형',`${c.primary} ${D.types[c.primary].name}  +  ${c.secondary} ${D.types[c.secondary].name}`],['관심 직업',clip(j.join(' · '),25)],['오늘 알아볼 과목',sub?.name||'아직 탐색 중'],['부스에서 질문하기','이 과목에서는 어떤 활동을 하나요?']];let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080"><rect width="800" height="1080" fill="#0d1835"/><rect x="45" y="45" width="710" height="990" rx="36" fill="#172849" stroke="#80e1eb" stroke-width="3"/><text x="90" y="116" font-size="26" font-family="sans-serif" fill="#97d8ef">CHANGWON GYEONGIL HIGH SCHOOL</text><text x="90" y="198" font-size="52" font-weight="bold" font-family="sans-serif" fill="white">나의 진로탐험 패스</text><text x="90" y="266" font-size="22" font-family="sans-serif" fill="#c6d7f2">지금의 관심에서 시작하는 진로·과목 탐험</text>${textlines.map(([k,v],i)=>`<text x="90" y="${365+i*157}" font-size="25" font-family="sans-serif" fill="#8adfec">${svgText(k)}</text><text x="90" y="${423+i*157}" font-size="34" font-weight="bold" font-family="sans-serif" fill="#ffffff">${svgText(v)}</text><line x1="90" x2="710" y1="${453+i*157}" y2="${453+i*157}" stroke="#ffffff30"/>`).join('')}<text x="90" y="1005" font-size="19" font-family="sans-serif" fill="#a8b8d2">RIASEC 간편 흥미탐색 · 직업 적합도 진단이 아닙니다.</text></svg>`;let blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='창원경일고_나의진로탐험패스.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);note('결과 카드를 저장했어요. 저장이 안 되면 화면 캡처를 이용하세요.')}
app.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-answer],[data-focus],[data-filter],[data-tab],[data-fav],[data-job],[data-pass],[data-subject],[data-track]');if(!el)return;let a=el.dataset.action;if(el.dataset.answer){state.answers[state.qIndex]=Number(el.dataset.answer);save();if(state.qIndex>=23){resultStart()}else{state.qIndex+=1;save();render()}window.scrollTo(0,0);return}if(el.dataset.focus){set({focus:el.dataset.focus});return}if(el.dataset.filter){set({filter:el.dataset.filter,sortAZ:false});return}if(el.dataset.tab){set({tab:el.dataset.tab,detail:null});window.scrollTo(0,0);return}if(el.dataset.track){set({tab:'jobs',filter:el.dataset.track});window.scrollTo(0,0);return}if(el.dataset.job){set({detail:el.dataset.job});return}if(el.dataset.fav){let id=el.dataset.fav;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();return}if(el.dataset.pass){let id=el.dataset.pass;state.pass=state.pass.includes(id)?state.pass.filter(x=>x!==id):[...state.pass,id].slice(0,3);save();render();note(state.pass.includes(id)?'탐험 패스에 담았어요!':'패스에서 제외했어요.');return}if(el.dataset.subject){set({chosenSubject:el.dataset.subject});return}if(a==='start'){let i=state.answers.findIndex(x=>x===null);set({page:i<0?'result':'quiz',qIndex:i<0?0:i});return}if(a==='next'){if(state.answers[state.qIndex]===null)return;if(state.qIndex>=23){resultStart()}else set({qIndex:state.qIndex+1});return}if(a==='prev'){set({qIndex:Math.max(0,state.qIndex-1)});return}if(a==='jobs'){set({page:'result',tab:'jobs',filter:'추천'});window.scrollTo(0,0);return}if(a==='reset'||a==='restart'){if(confirm('저장된 검사 결과와 즐겨찾기를 모두 지우고 새로 시작할까요?')){newQuiz()}return}if(a==='home'){set({page:'home'});return}if(a==='results'){resultStart();return}if(a==='toggle-sort'){set({sortAZ:!state.sortAZ});return}if(a==='clear-search'){set({search:'',filter:'전체'});return}if(a==='download'){download();return}if(a==='print'){window.print();return}if(a==='copy'){navigator.clipboard?.writeText(clipboard()).then(()=>note('탐험 내용을 복사했어요.')).catch(()=>note('복사가 지원되지 않아요.'));return}});
app.addEventListener('input',e=>{if(e.target.matches('[data-search]')){let pos=e.target.selectionStart;state.search=e.target.value;save();const items=allFiltered();let box=document.getElementById('jobgrid');if(box)box.innerHTML=(state.sortAZ?[...items].sort((a,b)=>a.name.localeCompare(b.name,'ko')):items).map(jobCard).join('');const label=box?.previousElementSibling?.querySelector('.tiny');if(label)label.textContent=`${items.length}개 직업 표시`;e.target.focus();try{e.target.setSelectionRange(pos,pos)}catch(err){}}if(e.target.id==='reflection'){state.reflection=e.target.value;save()}});
overlay.addEventListener('click',e=>{if(e.target.dataset.close){set({detail:null});return}let el=e.target.closest('[data-fav],[data-pass]');if(!el)return;let id=el.dataset.fav||el.dataset.pass;if(el.dataset.fav){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id]}else{state.pass=state.pass.includes(id)?state.pass.filter(x=>x!==id):[...state.pass,id].slice(0,3);note('탐험 패스를 수정했어요.')}save();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail)set({detail:null})});try{render()}catch(err){console.error(err);app.innerHTML=`<section class="panel" style="margin-top:40px"><h2>시작 화면을 표시할 수 없어요</h2><p>페이지를 새로고침하거나 다른 브라우저를 이용해 주세요.</p><p class="tiny">관리자 확인: ${esc(err.message)}</p></section>`}

} catch(err) {fatal(err);console.error(err);}
})();
</script></body></html>
